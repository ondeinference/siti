# smbCloud deploy configuration for the Siti AI landing page (web/).
#
# Deploy with:  smb deploy   (requires `smb login`)

name = "sitiai"
description = "Siti AI — private on-device personal assistant landing page."

[project]
id = 59
frontend_app_id = "1c28381c-7f8f-4637-822c-e2b31424448c"
# Local Next.js app directory to deploy (workspace member).
source = "web"
# Remote runtime directory on the server, under the git user's home.
path = "apps/web/sitiai"
# Deployment method.
kind = "nextjs-ssr"
# Package manager for the web/ workspace.
package_manager = "pnpm"
# PM2 process name on the server.
pm2_app = "siti-web"
# Port for the Next.js server (also set in web/ecosystem.config.js and web/nginx).
port = 3034
